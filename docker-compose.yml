services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: umbral
      MYSQL_USER: umbral
      MYSQL_PASSWORD: umbral
      MYSQL_ROOT_PASSWORD: umbral
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uumbral", "-pumbral"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - ./server/schema.mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 8050
      MYSQL_HOST: mysql
      REDIS_URL: redis://redis:6379
    ports:
      - "8050:8050"
    depends_on:
      - mysql
      - redis
